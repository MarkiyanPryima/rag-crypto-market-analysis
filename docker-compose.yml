services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: crypto_rag_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host mapping is a separate variable so a local Postgres already holding
      # 5432 does not block the stack.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run only on an empty data directory. After the volume exists, schema
      # edits require `docker compose down -v` (destroys data) or a migration.
      # Numeric prefixes fix the execution order explicitly — the entrypoint
      # sorts filenames, so the seed must not sort ahead of the schema.
      - ./bdd/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./bdd/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - crypto_rag_network
    healthcheck:
      # Dependents wait on this rather than on bare `depends_on`, which only
      # waits for the container to start, not for Postgres to accept queries.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: crypto_rag_redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - crypto_rag_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  crypto_rag_network:
    driver: bridge
