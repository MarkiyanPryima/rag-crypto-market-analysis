server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The UI talks only to the API; the API is not exposed to the browser directly.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
