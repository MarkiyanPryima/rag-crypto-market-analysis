# Tooling configuration only.
#
# This repository is a multi-service application, not an installable package, so
# there is deliberately no [project] or [build-system] table. Runtime dependencies
# live in each service's own requirements.txt (api/, collectors/, worker/,
# report_generator/); shared development tooling lives in requirements-dev.txt.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["api", "collectors", "worker", "report_generator"]
extend-exclude = ["frontend", "venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import ordering
    "B",    # bugbear — likely bugs and design problems
    "C4",   # comprehensions
    "UP",   # pyupgrade — modern syntax for the target version
    "SIM",  # simplify
    "RET",  # return-statement hygiene
    "PTH",  # prefer pathlib over os.path
    "DTZ",  # timezone-aware datetimes
    "T20",  # no print() — this project logs
    "S",    # bandit — security checks
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Assertions are the point of a test, and fixtures legitimately go unused.
"**/tests/**" = ["S101", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["api", "collectors", "worker", "report_generator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["api", "collectors", "worker", "report_generator"]
python_files = ["test_*.py"]
addopts = [
    "-ra",              # summarise everything except passes
    "--strict-markers", # unknown markers are errors, not silent no-ops
    "--strict-config",
]
markers = [
    "integration: requires a live Postgres or Redis (deselect with -m 'not integration')",
]
